[project]
name = "research-workflow-forge"
version = "0.15.0"
description = "Evidence-first modular research workflow, optional grouped CPU development pilots"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
paper-search = ["requests>=2.31,<3"]
openreview = ["requests>=2.31,<3", "openreview-py>=1.46"]
runner = ["scikit-learn>=1.4,<2"]
figures = ["matplotlib>=3.8,<4"]  # install only for explicitly requested figure rendering
figure-colormaps = ["matplotlib>=3.8,<4", "cmcrameri>=1.9"]  # only when required for optional scientific maps

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "adapters", "tools"]
