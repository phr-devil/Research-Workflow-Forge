[project]
name = "research-workflow-forge"
version = "0.4.0"
description = "Evidence-first modular research workflow, source-backed discovery and scientific handoff"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
paper-search = ["requests>=2.31,<3"]
openreview = ["requests>=2.31,<3", "openreview-py>=1.46"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "adapters", "tools"]
