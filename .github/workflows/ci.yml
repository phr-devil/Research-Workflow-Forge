name: Workflow contracts
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional paper-search adapter dependency
        run: python -m pip install -e '.[paper-search]'
      - name: All Forge unit tests (no live API requests)
        run: python -m unittest discover -s tests -v
      - name: Vendored ResearchStudio postprocessing selftest
        run: python vendor/researchstudio/paper_search/scripts/selftest_postprocess.py
      - name: Vendored ResearchStudio runtime selftest (local HTTP fixtures)
        run: python vendor/researchstudio/paper_search/scripts/selftest_runtime.py
      - name: CLI entry points (no external actions)
        run: |
          python -m core.cli --help
          python -m adapters.researchstudio_search --help
          python -m adapters.novelty_check --help
          python -m adapters.experiment_plan --help
          python -m core.cli validate --kind task --file templates/TASK.json
