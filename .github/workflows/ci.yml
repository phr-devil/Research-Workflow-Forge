name: Workflow contracts
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Structural contract and routing tests
        run: python -m unittest discover -s tests -v
      - name: CLI and adapter entrypoint smoke (no network)
        run: |
          python -m core.cli --help
          python -m adapters.literature --help
          python -m core.cli validate --kind task --file templates/TASK.json
